name: hela_service
description: HelaService — on-demand home services app (Sri Lanka). Frontend only.
publish_to: "none"
version: 0.1.0+2005

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1 # Plus Jakarta Sans, same as the Stitch export
  provider: ^6.1.2 # just for the Customer/Provider role switch
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.4.4
  firebase_app_check: ^0.3.1+4
  http: ^1.6.0
  http_parser: ^4.1.2
  firebase_remote_config: ^5.5.0
  shared_preferences: ^2.3.5
  image_picker: ^1.2.3
  image: ^4.3.0
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  vector_map_tiles: ^8.0.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  firebase_messaging: ^15.1.3
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2
  video_player: ^2.11.1
  video_compress: ^3.1.4
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/


